# Render Blueprint: New > Blueprint, pick this repo. Creates the API and the static frontend.
# The database is hosted on Neon (neon.tech); set DB_URL / DB_USER / DB_PASSWORD in the Render dashboard.

services:
  - type: web
    name: flowboard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health/liveness
    envVars:
      # Neon Postgres. DB_URL is JDBC form: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # set to the frontend URL, e.g. https://flowboard-web.onrender.com
      - key: SEED_DEMO
        value: "true"
      # Invitation emails (any SMTP provider: Gmail app password, Brevo, Resend, SendGrid...). Without a host, no email is sent.
      - key: APP_BASE_URL
        sync: false   # frontend URL, e.g. https://flowboard-web.onrender.com
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false   # sender address, usually the same as the SMTP username

  - type: web
    name: flowboard-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://flowboard-api-8h3y.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
